# Local Postgres for development and tests: `docker compose up -d`
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nffl_dev
    ports:
      - "5432:5432"
    volumes:
      - nffl-pg:/var/lib/postgresql/data
      - ./infra/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
volumes:
  nffl-pg:
