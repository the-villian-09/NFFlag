# Deploys the API to Cloud Run.
#  - push to main  → staging
#  - manual run    → choose staging or prod (prod requires approval in the
#                    GitHub "prod" environment's protection rules)
#
# Order: build image → run migrations job → deploy service → update worker job.
# Setup (one time, per environment): see infra/README.md.
name: Deploy API

on:
  push:
    branches: [main]
    paths: ["apps/api/**", "packages/shared/**", "pnpm-lock.yaml", ".github/workflows/deploy-api.yml"]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, prod]
        default: staging

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    concurrency: deploy-api-${{ github.event.inputs.environment || 'staging' }}
    env:
      ENV_NAME: ${{ github.event.inputs.environment || 'staging' }}
      REGION: ${{ vars.GCP_REGION }}
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/nffl/api:${{ github.sha }}
    steps:
      # Until infra/README.md sections 1–6 are done for this environment, the
      # GCP variables don't exist: skip the deploy with a notice instead of failing.
      - name: Check Google Cloud setup
        id: setup
        env:
          WIF: ${{ vars.GCP_WIF_PROVIDER }}
          SA: ${{ vars.GCP_DEPLOY_SA }}
        run: |
          missing=""
          [ -z "$PROJECT" ] && missing="$missing GCP_PROJECT_ID"
          [ -z "$REGION" ] && missing="$missing GCP_REGION"
          [ -z "$WIF" ] && missing="$missing GCP_WIF_PROVIDER"
          [ -z "$SA" ] && missing="$missing GCP_DEPLOY_SA"
          if [ -n "$missing" ]; then
            echo "::notice title=Deploy skipped::Google Cloud isn't set up for '$ENV_NAME' yet. Missing GitHub environment variables:$missing. See infra/README.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Catch typos and stray spaces before they turn into confusing errors.
          bad=""
          [[ "$PROJECT" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]] || bad="$bad GCP_PROJECT_ID='$PROJECT' (expected like nffl-staging-123456);"
          [[ "$REGION" =~ ^[a-z]+-[a-z]+[0-9]$ ]] || bad="$bad GCP_REGION='$REGION' (expected like us-east1);"
          [[ "$WIF" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[a-z0-9-]+/providers/[a-z0-9-]+$ ]] \
            || bad="$bad GCP_WIF_PROVIDER='$WIF' (expected projects/<number>/locations/global/workloadIdentityPools/github/providers/github);"
          [[ "$SA" =~ ^[a-z0-9-]+@[a-z0-9-]+\.iam\.gserviceaccount\.com$ ]] || bad="$bad GCP_DEPLOY_SA='$SA' (expected nffl-deployer@<project>.iam.gserviceaccount.com);"
          if [ -n "$bad" ]; then
            echo "::error title=Check GitHub variables::$bad"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.setup.outputs.ready == 'true'

      - uses: google-github-actions/auth@v2
        if: steps.setup.outputs.ready == 'true'
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.setup.outputs.ready == 'true'

      - name: Build and push image
        if: steps.setup.outputs.ready == 'true'
        run: |
          L=.github/scripts/run-logged.sh
          $L "Docker login" gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          $L "Docker build" docker build -f apps/api/Dockerfile -t "$IMAGE" .
          $L "Docker push" docker push "$IMAGE"

      - name: Run migrations and seed
        if: steps.setup.outputs.ready == 'true'
        run: |
          L=.github/scripts/run-logged.sh
          $L "Update migrate job" gcloud run jobs update "nffl-migrate-$ENV_NAME" --region "$REGION" --image "$IMAGE" --quiet
          $L "Run migrations" gcloud run jobs execute "nffl-migrate-$ENV_NAME" --region "$REGION" --wait

      - name: Deploy service
        if: steps.setup.outputs.ready == 'true'
        run: |
          L=.github/scripts/run-logged.sh
          $L "Deploy API service" \
            gcloud run deploy "nffl-api-$ENV_NAME" --region "$REGION" --image "$IMAGE" --quiet
          # Vercel's proxy calls the API as an ordinary HTTPS client, so the service must be
          # publicly invokable; every route still enforces its own sign-in and permissions.
          $L "Allow public access to API" \
            gcloud run services add-iam-policy-binding "nffl-api-$ENV_NAME" --region "$REGION" \
              --member=allUsers --role=roles/run.invoker --condition=None --quiet

      - name: Update outbox worker job
        if: steps.setup.outputs.ready == 'true'
        run: |
          .github/scripts/run-logged.sh "Update worker job" \
            gcloud run jobs update "nffl-worker-$ENV_NAME" --region "$REGION" --image "$IMAGE" --quiet

      - name: Smoke test
        if: steps.setup.outputs.ready == 'true'
        run: |
          URL=$(gcloud run services describe "nffl-api-$ENV_NAME" --region "$REGION" --format 'value(status.url)')
          .github/scripts/run-logged.sh "Smoke test ($URL/api/v1/ready)" curl --fail --silent --show-error "$URL/api/v1/ready"
          echo "::notice title=Deployed::API is live at $URL"
