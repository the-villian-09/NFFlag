name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The deploy workflow runs these same checks first and deploys only if they pass.
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when called from Deploy API, so the two don't cancel each other.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nffl_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/nffl_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nffl/shared build
      - name: Typecheck
        run: pnpm -r typecheck
      - name: API tests (real Postgres)
        run: pnpm --filter @nffl/api test
      - name: Build API
        run: pnpm --filter @nffl/api build
      - name: Build web
        run: pnpm --filter @nffl/web build
        env:
          API_ORIGIN: http://localhost:8080
