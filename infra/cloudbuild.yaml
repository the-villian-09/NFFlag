# Builds the API image with Cloud Build (no local Docker needed). From the repo root:
#   gcloud builds submit --config infra/cloudbuild.yaml \
#     --substitutions _IMAGE=us-east1-docker.pkg.dev/PROJECT/nffl/api:first
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "apps/api/Dockerfile", "-t", "${_IMAGE}", "."]
images: ["${_IMAGE}"]
